<SearchComponent (search)="onSearch($event)" label="Buscar" placeholder="UASD" />
<!-- table -->
<table mat-table [dataSource]="institutions()" class="mat-shadow-2">
  <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->


  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let element">{{ element.name }}</td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="image">
    <th mat-header-cell *matHeaderCellDef>Imagen</th>
    <td mat-cell *matCellDef="let element">{{ element.image }}</td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="teacher">
    <th mat-header-cell *matHeaderCellDef>Teacher</th>
    <td mat-cell *matCellDef="let element">{{ element.teacherId }}</td>
  </ng-container>

  <ng-container matColumnDef="students">
    <th mat-header-cell *matHeaderCellDef>Estudiantes</th>
    <td mat-cell *matCellDef="let element">{{ element.students.length }}</td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let element">
      <div class="flex justify-center">
        <button matIconButton><mat-icon>arrow_forward</mat-icon></button>
        <button matIconButton><mat-icon>edit</mat-icon></button>
        <button matIconButton><mat-icon>delete</mat-icon></button>
        <button matIconButton><mat-icon>person_add</mat-icon></button>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<mat-paginator
  [length]="totalElements()"
  [pageSize]="pageSize()"
  [pageSizeOptions]="[5, 10, 25]"
  [pageIndex]="currentPage()"
  (page)="onPageChange($event)"
  aria-label="Select page"
>
</mat-paginator>
