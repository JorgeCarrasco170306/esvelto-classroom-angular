@if (loading()) {
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
} @else {
  <PageHeaderComponent title="Instituciones" [buttons]="buttons"></PageHeaderComponent>

  <!-- TODO: mostrar todas las instituciones y poder crear instituciones-->
  <!-- TODO: mostrar el detalle de una institución con todos sus estudiantes -->

  <!-- search -->
  <!-- TODO: implementar búsqueda -->
  <SearchComponent (search)="onSearch($event)" label="Buscar" placeholder="Matematicas" />
  <!-- table -->
  <table mat-table [dataSource]="courses()" class="mat-shadow-2">
    <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let element">{{ element.name }}</td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="institution">
      <th mat-header-cell *matHeaderCellDef>Institución</th>
      <td mat-cell *matCellDef="let element">{{ element.institution.name }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let element">
        <div class="flex justify-center">
          <button matIconButton (click)="viewCourse(element.id)">
            <mat-icon>arrow_forward</mat-icon>
          </button>
          <button matIconButton><mat-icon>edit</mat-icon></button>
          <button (click)="openDialog(element.id)" matIconButton>
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
